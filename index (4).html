<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>INTER for download</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;color:#fff;height:100vh;overflow:hidden;font-family:Arial, Helvetica, sans-serif}
    #intro{
      position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#000;cursor:pointer;user-select:none;
      transition:opacity .8s ease;
    }
    #intro.hidden{opacity:0;pointer-events:none}
    .pixel-text{
      font-family:'Press Start 2P',monospace;
      font-size:1.6rem;
      text-align:center;
      letter-spacing:2px;
      white-space:nowrap;
    }
    #status{
      position:fixed;left:12px;bottom:12px;color:#aaa;font-size:13px;opacity:0;transition:opacity .6s;
    }
    #status.show{opacity:1}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

  <!-- الشاشة الأولى -->
  <div id="intro" aria-label="intro-screen" role="button" tabindex="0">
    <div class="pixel-text">INTER for download</div>
  </div>

  <!-- رابط التحميل -->
  <a id="downloadLink" href="file_to_download.zip" download style="display:none">download</a>

  <div id="status">جاري بدء التحميل… إذا لم يبدأ، <a id="manual" href="file_to_download.zip" download style="color:#fff;text-decoration:underline">اضغط هنا</a></div>

  <script>
    const intro = document.getElementById('intro');
    const dl = document.getElementById('downloadLink');
    const status = document.getElementById('status');

    function startDownload() {
      intro.classList.add('hidden');
      setTimeout(()=> intro.style.display = 'none', 800);
      status.classList.add('show');

      // بدء التحميل تلقائياً
      try { dl.click(); }
      catch(e){ console.warn('auto-download blocked', e); }

      setTimeout(()=> status.classList.remove('show'), 6000);
    }

    intro.addEventListener('click', startDownload);
    intro.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault(); startDownload();
      }
    });
  </script>

</body>
</html>
